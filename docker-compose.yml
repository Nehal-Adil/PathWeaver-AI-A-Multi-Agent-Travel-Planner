version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathweaver_db
    environment:
      POSTGRES_USER: pathweaver_admin
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: pathweaver_travel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pathweaver_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pathweaver.ai
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8082:80"
    depends_on:
      - postgres

volumes:
  pgdata:
