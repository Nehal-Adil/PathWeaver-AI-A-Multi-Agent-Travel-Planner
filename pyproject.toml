[project]
name = "pathweaver-ai-a-multi-agent-travel-planner"
version = "0.1.0"
description = "A multi-agent custom travel planner."
readme = "README.md"
authors = [
    { name = "Nehal Adil", email = "mdnehaladil@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "nest-asyncio>=1.6.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
pathweaver-ai-a-multi-agent-travel-planner = "pathweaver_ai_a_multi_agent_travel_planner:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
